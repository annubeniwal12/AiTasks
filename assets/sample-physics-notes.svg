<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="paperGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  
  <rect x="20" y="20" width="560" height="360" rx="12" fill="url(#paperGrad2)" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow2)"/>
  
  <!-- Graph grid background -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
  </pattern>
  <rect x="21" y="21" width="558" height="358" fill="url(#grid)" rx="11"/>

  <!-- Content -->
  <text x="50" y="60" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold" fill="#0f172a">
    PHYSICS: KINEMATICS &amp; ENERGY
  </text>
  <line x1="50" y1="72" x2="550" y2="72" stroke="#6366f1" stroke-width="2"/>

  <!-- Equations -->
  <rect x="50" y="90" width="490" height="45" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="70" y="118" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#4338ca">
    1. v = u + a*t   |   2. s = u*t + (1/2)*a*t^2
  </text>

  <rect x="50" y="150" width="490" height="45" rx="8" fill="#fdf4ff" stroke="#f5d0fe"/>
  <text x="70" y="178" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#86198f">
    3. v^2 = u^2 + 2*a*s   |   Work = F * d * cos(θ)
  </text>

  <rect x="50" y="210" width="490" height="45" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="70" y="238" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#15803d">
    Kinetic Energy: KE = 0.5 * m * v^2  (Joules)
  </text>

  <text x="50" y="290" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#475569">
    • Potential Energy (Gravitational): PE = m * g * h  (where g = 9.8 m/s²)
  </text>
  <text x="50" y="325" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#475569">
    • Law of Conservation: E_total = KE_initial + PE_initial = KE_final + PE_final
  </text>
  
  <text x="50" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#e11d48">
    Note: Friction does negative work, converting mechanical energy to thermal energy!
  </text>
</svg>
